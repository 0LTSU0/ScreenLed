name: Build ScreenLed GUI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -S ScreenLedGUI -B build

      - name: Build project
        run: cmake --build build --config Release
