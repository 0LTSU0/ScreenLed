name: Build ScreenLed GUI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true

      - name: Install Linux specific things
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libopencv-dev libxrandr-dev

      - name: Configure CMake
        run: cmake -S ScreenLedGUI -B build

      - name: Build project
        run: cmake --build build --config Release
